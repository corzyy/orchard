[package]
name = "orchard-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "System Settings for the Orchard compositor"

[dependencies]
orchard-config = { path = "../orchard-config" }
orchard-ui = { git = "https://github.com/corzyy/orchard-ui", branch = "main" }
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas"] }
tokio = { version = "1", features = ["time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
