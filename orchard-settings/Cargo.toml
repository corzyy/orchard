[package]
name = "orchard-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "System Settings for the Orchard compositor"

[dependencies]
orchard-config = { path = "../orchard-config" }
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_extras = { version = "0.33", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.45"
serde_json = "1"
