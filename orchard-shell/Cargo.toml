[package]
name = "orchard-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Menu bar and Dock for the Orchard compositor"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orchard-config = { path = "../orchard-config" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
