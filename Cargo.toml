[workspace]
resolver = "2"
members = ["orchard", "orchard-shell", "orchard-config", "orchard-settings", "orchard-lock"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Incremental release builds: dist/dev.sh rebuilds only what changed instead of
# recompiling a whole crate from scratch on every edit.
[profile.release]
incremental = true
